<title>Convite Ana e César</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* LAYOUT: UMA CENA CENTRAL EM CAMADAS, COMO UM CONVITE FÍSICO SENDO ABERTO. */
  :root {
    --fundo: #eee8de;
    --fundo-luz: #faf7f0;
    --papel: #d7c2a0;
    --papel-escuro: #a7865e;
    --oliva: #52572d;
    --oliva-profundo: #33391e;
    --ouro-claro: #f8e7a2;
    --ouro: #c99c36;
    --ouro-profundo: #765119;
    --texto: #373329;
    --sombra: rgba(52, 43, 30, 0.23);
    --sombra-forte: rgba(39, 31, 21, 0.35);
    --fonte-display: "Bodoni Moda", Georgia, serif;
    --fonte-ui: "Montserrat", Arial, sans-serif;
    color-scheme: light;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
  }

  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 42%, var(--fundo-luz) 0 24%, transparent 62%),
      linear-gradient(145deg, var(--fundo-luz), var(--fundo));
    color: var(--texto);
    font-family: var(--fonte-ui);
  }

  button,
  img {
    -webkit-tap-highlight-color: transparent;
  }

  .pagina {
    position: relative;
    display: grid;
    width: 100%;
    height: 100%;
    min-height: 100%;
    place-items: center;
    overflow: hidden;
    isolation: isolate;
    padding-inline: max(16px, 4vw);
    padding-block: max(18px, 4vh);
  }

  .pagina::before,
  .pagina::after {
    position: absolute;
    width: min(36vw, 460px);
    aspect-ratio: 1;
    border: 1px solid color-mix(in srgb, var(--oliva) 14%, transparent);
    border-radius: 50%;
    content: "";
    pointer-events: none;
  }

  .pagina::before {
    top: -23vw;
    left: -15vw;
  }

  .pagina::after {
    right: -18vw;
    bottom: -25vw;
  }

  .grao {
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: 0.24;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
  }

  .cabecalho {
    position: absolute;
    top: max(20px, 4vh);
    left: 50%;
    z-index: 20;
    display: grid;
    justify-items: center;
    gap: 7px;
    width: min(90vw, 540px);
    transform: translateX(-50%);
    text-align: center;
    transition: opacity 700ms ease, transform 700ms ease;
  }

  .cabecalho__linha {
    width: 36px;
    height: 1px;
    background: var(--oliva);
    opacity: 0.65;
  }

  .cabecalho__texto {
    margin: 0;
    color: var(--oliva-profundo);
    font-size: clamp(0.64rem, 1.8vw, 0.76rem);
    font-weight: 600;
    letter-spacing: 0.24em;
    line-height: 1.5;
    text-transform: uppercase;
  }

  .cena {
    position: relative;
    z-index: 5;
    width: min(82vw, 680px);
    aspect-ratio: 1.07 / 1;
    perspective: 1500px;
  }

  .envelope-botao {
    position: absolute;
    inset: 10% 0 auto;
    z-index: 9;
    display: block;
    width: 100%;
    aspect-ratio: 1.16 / 1;
    padding: 0;
    overflow: visible;
    border: 0;
    background: transparent;
    cursor: pointer;
    transform: translateY(0) scale(1);
    transform-origin: 50% 72%;
    transition:
      transform 1300ms cubic-bezier(0.2, 0.8, 0.2, 1),
      opacity 900ms ease,
      filter 900ms ease;
  }

  .envelope-botao:focus-visible,
  .tela-dourada:focus-visible {
    outline: 3px solid var(--ouro);
    outline-offset: 7px;
  }

  .envelope-botao:hover:not(:disabled) {
    transform: translateY(-5px) scale(1.012);
  }

  .envelope-arte {
    position: absolute;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 28px 55px var(--sombra), 0 8px 18px var(--sombra-forte);
    transition: opacity 500ms ease, filter 900ms ease;
    user-select: none;
  }

  .envelope-flap {
    position: absolute;
    top: 18.1%;
    left: 5.8%;
    z-index: 4;
    width: 88.5%;
    height: 43%;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background:
      linear-gradient(150deg, rgba(255, 255, 255, 0.28), transparent 42%),
      linear-gradient(180deg, var(--papel), #c7ad84);
    filter: drop-shadow(0 7px 6px rgba(55, 44, 30, 0.2));
    transform: rotateX(90deg);
    transform-origin: 50% 0;
    opacity: 0;
    transition:
      transform 1050ms cubic-bezier(0.22, 0.75, 0.16, 1),
      opacity 180ms ease;
    backface-visibility: hidden;
  }

  .monograma {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 5;
    width: clamp(54px, 11vw, 88px);
    aspect-ratio: 1;
    object-fit: contain;
    border-radius: 50%;
    transform: translate(-50%, -15%);
    filter: drop-shadow(0 6px 6px rgba(38, 42, 20, 0.28));
    transition: opacity 260ms ease, transform 800ms ease;
  }

  .convite-revelado {
    position: fixed;
    top: 50%;
    left: 50%;
    z-index: 7;
    width: min(88vw, 510px);
    height: min(89vh, 720px);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 38%) scale(0.72);
    transform-origin: 50% 70%;
    transition:
      transform 1500ms cubic-bezier(0.18, 0.8, 0.18, 1),
      opacity 650ms ease;
  }

  .convite-moldura {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--fundo-luz);
    border: 1px solid color-mix(in srgb, var(--ouro-profundo) 38%, transparent);
    box-shadow: 0 35px 80px var(--sombra-forte), 0 10px 24px var(--sombra);
  }

  .convite-imagem {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: var(--fundo-luz);
  }

  .tela-dourada {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    padding: clamp(30px, 7vw, 64px);
    border: 0;
    color: var(--oliva-profundo);
    cursor: pointer;
    background:
      linear-gradient(112deg, transparent 0 27%, rgba(255, 255, 255, 0.65) 39%, transparent 51% 100%),
      radial-gradient(circle at 28% 18%, var(--ouro-claro), transparent 31%),
      linear-gradient(145deg, #8f6520, #f1d275 28%, #bd8427 58%, #f8e6a6 100%);
    background-size: 250% 100%, 100% 100%, 100% 100%;
    animation: brilho-dourado 5.5s ease-in-out infinite;
    transition: opacity 900ms ease, transform 1000ms ease, visibility 900ms;
  }

  .tela-dourada::before,
  .tela-dourada::after {
    position: absolute;
    inset: clamp(12px, 3vw, 22px);
    border: 1px solid rgba(74, 52, 16, 0.55);
    content: "";
    pointer-events: none;
  }

  .tela-dourada::after {
    inset: clamp(17px, 4vw, 29px);
    border-color: rgba(255, 246, 198, 0.58);
  }

  .dourado-conteudo {
    display: grid;
    justify-items: center;
    gap: clamp(18px, 4vh, 34px);
    max-width: 360px;
  }

  .dourado-ornamento {
    width: 48px;
    height: 1px;
    background: var(--oliva-profundo);
    box-shadow: 0 -5px 0 -2px var(--oliva-profundo), 0 5px 0 -2px var(--oliva-profundo);
    opacity: 0.72;
  }

  .dourado-frase {
    margin: 0;
    font-family: var(--fonte-display);
    font-size: clamp(2rem, 7vw, 3.65rem);
    font-weight: 400;
    line-height: 1.12;
    text-wrap: balance;
  }

  .dourado-instrucao {
    margin: 0;
    font-size: clamp(0.62rem, 1.8vw, 0.72rem);
    font-weight: 600;
    letter-spacing: 0.2em;
    line-height: 1.6;
    text-transform: uppercase;
  }

  .instrucao {
    position: absolute;
    bottom: max(18px, 4vh);
    left: 50%;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 11px;
    margin: 0;
    color: var(--oliva-profundo);
    font-size: clamp(0.65rem, 2vw, 0.76rem);
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transform: translateX(-50%);
    white-space: nowrap;
    transition: opacity 500ms ease, transform 500ms ease;
  }

  .instrucao__ponto {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--oliva);
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--oliva) 36%, transparent);
    animation: pulso 2s ease-out infinite;
  }

  .pagina.abrindo .envelope-arte {
    opacity: 0.86;
    filter: sepia(0.08) brightness(1.03);
  }

  .pagina.abrindo .envelope-flap,
  .pagina.aberto .envelope-flap {
    opacity: 1;
    transform: rotateX(-178deg);
  }

  .pagina.abrindo .monograma,
  .pagina.aberto .monograma {
    opacity: 0;
    transform: translate(-50%, -60%) scale(0.72);
  }

  .pagina.aberto .envelope-botao {
    opacity: 0.28;
    filter: blur(1.5px) saturate(0.7);
    pointer-events: none;
    transform: translateY(34vh) scale(0.72);
  }

  .pagina.aberto .convite-revelado {
    z-index: 12;
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  .pagina.aberto .cabecalho,
  .pagina.aberto .instrucao {
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -12px);
  }

  .pagina.convite-final .tela-dourada {
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    transform: scale(1.035);
  }

  @keyframes pulso {
    70%, 100% {
      box-shadow: 0 0 0 12px transparent;
    }
  }

  @keyframes brilho-dourado {
    0%, 30% { background-position: 110% 0, 0 0, 0 0; }
    72%, 100% { background-position: -90% 0, 0 0, 0 0; }
  }

  @media (max-width: 620px) {
    .cabecalho {
      top: max(18px, 3vh);
    }

    .cena {
      width: min(94vw, 520px);
    }

    .envelope-botao {
      inset-block-start: 15%;
    }

    .convite-revelado {
      width: min(92vw, 460px);
      height: min(82vh, 650px);
    }

    .instrucao {
      bottom: max(16px, 3vh);
    }
  }

  @media (max-height: 650px) and (orientation: landscape) {
    .cabecalho {
      top: 12px;
    }

    .cena {
      width: min(62vw, 520px);
    }

    .convite-revelado {
      width: min(42vw, 430px);
      height: 91vh;
    }

    .instrucao {
      bottom: 10px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
    }
  }
</style>

<main class="pagina" id="pagina">
  <div class="grao" aria-hidden="true"></div>

  <header class="cabecalho" aria-hidden="true">
    <span class="cabecalho__linha"></span>
    <p class="cabecalho__texto">Uma mensagem especial espera por você</p>
  </header>

  <section class="cena" aria-label="Convite de casamento interativo">
    <button class="envelope-botao" id="envelope" type="button" aria-label="Abrir o envelope">
      <!-- COLE AQUI O LINK DA ARTE DO SEU ENVELOPE -->
      <img class="envelope-arte" src="Envelope artesanal com selo verde oliva.png" alt="Envelope artesanal fechado com selo verde oliva">

      <span class="envelope-flap" aria-hidden="true"></span>

      <!-- COLE AQUI O LINK DO SEU MONOGRAMA -->
      <img class="monograma" src="brasao-cesar-ana.svg" alt="" aria-hidden="true">
    </button>

    <article class="convite-revelado" id="conviteRevelado" aria-live="polite">
      <div class="convite-moldura">
        <!-- COLE AQUI O LINK DO SEU CONVITE PRINCIPAL -->
        <img class="convite-imagem" id="conviteGeral" src="Convite de casamento .jpg" alt="Convite de casamento de Ana e César">

        <!-- COLE AQUI O LINK DO CONVITE DOS PADRINHOS -->
        <img class="convite-imagem" id="convitePadrinhos" src="Madrinhas e Padrinhos 2.jpg" alt="Convite especial para madrinhas e padrinhos" hidden>

        <button class="tela-dourada" id="telaDourada" type="button" aria-label="Revelar o convite dos padrinhos" hidden>
          <span class="dourado-conteudo">
            <span class="dourado-ornamento" aria-hidden="true"></span>
            <span class="dourado-frase">Você recebeu um convite dourado...</span>
            <span class="dourado-instrucao">Toque para revelar</span>
          </span>
        </button>
      </div>
    </article>
  </section>

  <p class="instrucao" id="instrucao">
    <span class="instrucao__ponto" aria-hidden="true"></span>
    <span>Toque no envelope</span>
  </p>
</main>

<script>
  /* ================================================================
     ESCOLHA A VERSÃO DO CONVITE:
     false = CONVIDADO GERAL | true = PADRINHOS
     ================================================================ */
  const isPadrinho = true;

  const pagina = document.getElementById("pagina");
  const envelope = document.getElementById("envelope");
  const conviteRevelado = document.getElementById("conviteRevelado");
  const conviteGeral = document.getElementById("conviteGeral");
  const convitePadrinhos = document.getElementById("convitePadrinhos");
  const telaDourada = document.getElementById("telaDourada");

  let envelopeAberto = false;
  let conviteFinalRevelado = false;

  function configurarVersao() {
    conviteGeral.hidden = isPadrinho;
    convitePadrinhos.hidden = !isPadrinho;
    telaDourada.hidden = !isPadrinho;
  }

  function abrirEnvelope() {
    if (envelopeAberto) return;

    envelopeAberto = true;
    envelope.disabled = true;
    pagina.classList.add("abrindo");

    window.setTimeout(() => {
      pagina.classList.add("aberto");
      conviteRevelado.setAttribute("tabindex", "-1");

      if (isPadrinho) {
        telaDourada.focus({ preventScroll: true });
      } else {
        conviteRevelado.focus({ preventScroll: true });
      }
    }, 420);
  }

  function revelarConvitePadrinhos() {
    if (!isPadrinho || conviteFinalRevelado) return;

    conviteFinalRevelado = true;
    pagina.classList.add("convite-final");
    conviteRevelado.setAttribute("aria-label", "Convite especial para madrinhas e padrinhos revelado");
  }

  configurarVersao();
  envelope.addEventListener("click", abrirEnvelope);
  telaDourada.addEventListener("click", revelarConvitePadrinhos);
</script>
